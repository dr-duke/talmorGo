services:
  talmor:
    image: ghcr.io/dr-duke/talmorgo:latest
    build: .
    restart: unless-stopped
    ports:
      # Только локальный адрес. Публикация на все интерфейсы вместе с пустым
      # WEB_TOKEN по умолчанию отдавала полный интерфейс — с удалением файлов,
      # выпуском постоянных ссылок и настройками — любому в локальной сети.
      # Наружу выставляйте через обратный прокси, задав WEB_TOKEN.
      - "127.0.0.1:8080:8080"
    volumes:
      # Замените на свой каталог. Контейнер работает под uid 1000, поэтому
      # каталог должен быть ему доступен на запись:
      #   chown -R 1000:1000 ./media
      # При обновлении с версий, работавших под root, этот chown нужен разово.
      - ./media:/data
    environment:
      # Обязательные
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      BASE_URL: "${BASE_URL:-http://localhost:8080}"

      # Безопасность.
      # Пустой TELEGRAM_ALLOWED_IDS пускает к боту любого, кто узнает его имя;
      # пустой WEB_TOKEN полностью отключает авторизацию в веб-интерфейсе.
      # Приложение предупреждает об обоих случаях в логе при старте.
      TELEGRAM_ALLOWED_IDS: "${TELEGRAM_ALLOWED_IDS:-}"
      WEB_TOKEN: "${WEB_TOKEN:-}"

      # Прокси (если нужны)
      TELEGRAM_PROXY: "${TELEGRAM_PROXY:-}"
      YT_DLP_PROXY: "${YT_DLP_PROXY:-}"

      # Загрузчик
      YT_DLP_TIMEOUT: "${YT_DLP_TIMEOUT:-300}"
      YT_DLP_OUTPUT_FORMAT: "${YT_DLP_OUTPUT_FORMAT:-mp4}"
      YT_DLP_EXTRA_ARGS: "${YT_DLP_EXTRA_ARGS:-}"
      WORKER_COUNT: "${WORKER_COUNT:-2}"

      # Пути (внутри контейнера).
      # YT_DLP_BINARY не задаём: образ сам указывает на /usr/bin/yt-dlp.
      YT_DLP_OUTPUT_DIR: /data
      DB_PATH: /data/talmor.db
