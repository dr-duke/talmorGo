name: Docker

on:
  push:
    branches: [ "main" ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ "main" ]
  # пересборка руками: старые прогоны GitHub через месяц не перезапускает
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.887
      - name: Generate templates
        run: templ generate ./web/templates/...
      - name: Run tests
        run: go test $(go list ./... | grep -v tests/e2e)

  # Браузерные тесты вынесены в отдельный job: им нужен headless-Chrome.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      - name: Install templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.887
      - name: Generate templates
        run: templ generate ./web/templates/...
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v2
        id: chrome
      - name: Run browser tests
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: go test ./tests/e2e/... -count=1

  build:
    needs: [test, e2e]
    runs-on: ubuntu-latest
    outputs:
      digest: ${{ steps.build-and-push.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: 'v2.6.5'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log into registry ${{ env.REGISTRY }}
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            # latest — только на релизные теги, а не на каждый коммит в main
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            # main — bleeding edge для тех, кто хочет последний коммит
            type=raw,value=main,enable={{is_default_branch}}
            # v0.0.1 (с v-префиксом, совпадает с git-тегом)
            type=semver,pattern=v{{version}}
            # 0.0.1 (без префикса, для совместимости)
            type=semver,pattern={{version}}
            # плавающий минорный тег: 0.0 → всегда последний патч
            type=semver,pattern={{major}}.{{minor}}
            # sha для трассируемости каждого билда
            type=sha,prefix=sha-

      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.build-and-push.outputs.digest }}
        run: echo "${TAGS}" | xargs -I {} cosign sign --yes {}@${DIGEST}

  # Релизный тег → pull request в home-lab (Forgejo) с новым digest образа.
  # Выкат в кластер делает Ansible из home-lab после слияния PR; здесь только
  # правка talmorgo_image_digest в ansible/inventory.yml через API contents.
  homelab-pr:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      HOME_LAB_API: ${{ secrets.HOME_LAB_API }}
      HOME_LAB_TOKEN: ${{ secrets.HOME_LAB_TOKEN }}
      DIGEST: ${{ needs.build.outputs.digest }}
      VERSION: ${{ github.ref_name }}
    steps:
      - name: Открыть PR в home-lab
        run: |
          python3 - <<'PY'
          import base64, json, os, re, sys, urllib.request, urllib.error
          api = os.environ["HOME_LAB_API"].rstrip("/")
          repo = "dr_duke/home-lab"; path = "ansible/inventory.yml"
          version = os.environ["VERSION"].lstrip("v"); digest = os.environ["DIGEST"].split(":")[1]
          branch = "app/talmorgo-" + version
          hdr = {"Authorization": "token " + os.environ["HOME_LAB_TOKEN"], "Content-Type": "application/json"}
          def call(method, url, body=None):
              req = urllib.request.Request(api + url, method=method, headers=hdr,
                                           data=json.dumps(body).encode() if body is not None else None)
              try:
                  with urllib.request.urlopen(req, timeout=60) as r: return json.load(r)
              except urllib.error.HTTPError as e:
                  sys.exit("%s %s -> %s %s" % (method, url, e.code, e.read().decode()[:300]))
          cur = call("GET", "/repos/%s/contents/%s?ref=main" % (repo, path))
          text = base64.b64decode(cur["content"]).decode()
          new, n = re.subn(r'(talmorgo_image_digest: ")[0-9a-f]{64}(".*)', r'\g<1>' + digest + r'"  # v' + version, text, count=1)
          if n != 1: sys.exit("talmorgo_image_digest не найден")
          if new == text: print("digest уже такой, PR не нужен"); sys.exit(0)
          call("PUT", "/repos/%s/contents/%s" % (repo, path), {
              "branch": "main", "new_branch": branch, "sha": cur["sha"],
              "content": base64.b64encode(new.encode()).decode(),
              "message": "talmorgo: выкат %s\n\nОбраз ghcr.io/dr-duke/talmorgo:%s\nsha256:%s" % (version, version, digest)})
          pr = call("POST", "/repos/%s/pulls" % repo, {
              "head": branch, "base": "main", "title": "talmorgo: выкат " + version,
              "body": "Собрано GitHub Actions из тега v%s.\n\nОбраз `ghcr.io/dr-duke/talmorgo:%s`\n`sha256:%s`\n\n"
                      "После слияния: `play_single_app.yml -e target_app_name=talmorgo` и `talmorgo-private`." % (version, version, digest)})
          print("PR:", pr["html_url"])
          PY
